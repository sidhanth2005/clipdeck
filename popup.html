<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px system-ui, sans-serif; width: 250px; margin: 0; padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  #status { margin: 0 0 12px; color: #444; }
  button { width: 100%; padding: 9px; margin-bottom: 8px; border: 0; border-radius: 6px; font-size: 14px; cursor: pointer; }
  #start { background: #4f46e5; color: #fff; }
  #save, #reselect { background: #e5e7eb; }
  #stop { background: #dc2626; color: #fff; }
  button[hidden] { display: none; }
  small { color: #777; display: block; line-height: 1.35; }
</style>
</head>
<body>
  <h1>Clipdeck</h1>
  <p id="status">Not running</p>
  <button id="start">Start (select slide area)</button>
  <button id="reselect" hidden>Re-select boxes (keeps slides)</button>
  <button id="save" hidden>Save Word doc now</button>
  <button id="stop" hidden>Stop &amp; save</button>
  <small>Start it while a slide is on screen. Step 1: box ONLY the slide. Step 2: box the PowerPoint ribbon tabs (same on every slide).</small>
  <script src="popup.js"></script>
</body>
</html>
